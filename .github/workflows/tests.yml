name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MPLBACKEND: Agg
      LOKY_MAX_CPU_COUNT: "2"
      PYTHONPATH: .

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile source
        run: python -m compileall -q -x '(^|/)(\.venv|artifacts)/' .

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Smoke-test command interfaces
        run: |
          python train_victim.py --help > /dev/null
          python train_adversary.py --help > /dev/null
          python mcmc_failure_trace.py --help > /dev/null
          python eval_constant_wind.py --help > /dev/null
          python eval_sine_wind.py --help > /dev/null
          python extract_transformer_latents.py --help > /dev/null
          python analyze_transformer_latents.py --help > /dev/null
          python plot_wind_history.py --help > /dev/null
          python plot_episode_length_histogram.py --help > /dev/null
